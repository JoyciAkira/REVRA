# REVRA web: static + proxy API (nessuna CORS da gestire)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy: tutti i prefissi dei moduli REVRA
    location ~ ^/(analysis|hybrid|consensus|cognitive|formats|epistemic|sovereign|timeline|audit|auth|triage)/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
