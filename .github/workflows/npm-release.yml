name: npm-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: update npm (trusted publishing OIDC richiede >=11.5.1)
        run: npm install -g npm@latest
      - name: publish
        run: npm publish --provenance
        working-directory: packages/revra-verify
